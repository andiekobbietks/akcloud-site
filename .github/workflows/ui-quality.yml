name: AKTOps UI quality and visual evidence

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aktops-ui-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-browser:
    name: Static checks, interactions, accessibility and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run existing Node tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run UI, interaction, responsive and accessibility tests
        run: npx playwright test

      - name: Upload screenshots, traces, JUnit and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aktops-ui-evidence-${{ github.run_number }}-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 30
